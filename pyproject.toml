[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenometer-local"
version = "0.1.0"
description = "Read-only local Codex and Antigravity usage receipts"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tokenometer = "tokenometer.cli:main"

[tool.setuptools.packages.find]
include = ["tokenometer*"]
